[package]
name = "ipswatch"
version = "1.2.1"
edition = "2021"
description = "Capture OPNsense IPS (Suricata) alerts and flag potential unwanted access"
license = "MIT"
build = "build.rs"

[lib]
path = "src/lib.rs"

# Desktop app (no console window).
[[bin]]
name = "IPSWatch"
path = "src/bin/gui/main.rs"
required-features = ["gui"]

# Headless / scripting / service use.
[[bin]]
name = "ipswatch-cli"
path = "src/bin/cli.rs"

# The desktop app (IPSWatch) and the crates only it uses. On by default, so
# Windows builds are unchanged. `--no-default-features` builds the library and
# ipswatch-cli alone, which is how Linux CI builds it (winit needs an x11 or
# wayland backend there, and the tray app is Windows-only anyway).
[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:open", "dep:rfd"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui_extras = { version = "0.31", optional = true }
ipnet = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder"] }
log = "0.4"
native-tls = "0.2"
open = { version = "5", optional = true }
rfd = { version = "0.15", optional = true }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
x509-parser = "0.16"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tauri-winrt-notification = "0.7"
tray-icon = "0.20"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
winreg = "0.55"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
